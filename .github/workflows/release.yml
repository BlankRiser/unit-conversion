name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Sync version with GitHub Release tag
        if: github.event.release.tag_name != ''
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bun -e '
            import fs from "node:fs";
            const rawTag = process.env.RELEASE_TAG || "";
            const version = rawTag.replace(/^v/, "").trim();
            if (!/^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid semantic version derived from tag "${rawTag}": "${version}"`);
            }
            for (const file of ["packages/unit-conversion/package.json", "packages/unit-conversion/jsr.jsonc"]) {
              const content = fs.readFileSync(file, "utf8");
              fs.writeFileSync(file, content.replace(/("version"\s*:\s*)"[^"]+"/, `$1"${version}"`), "utf8");
            }
            console.log(`Synced package.json and jsr.jsonc to ${version}`);
          '

      - name: Test package version consistency
        run: bun run convert test:run

      - name: Build
        run: bun run convert build

      - name: "Publish to NPM (Trusted Publisher OIDC)"
        working-directory: ./packages/unit-conversion
        run: npm publish --provenance --access=public

      - name: "Publish to JSR"
        working-directory: ./packages/unit-conversion
        run: npx jsr publish
